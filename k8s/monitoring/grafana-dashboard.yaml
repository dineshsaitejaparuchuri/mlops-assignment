apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: heart-mlops
data:
  heart-api.json: |
    {
      "uid": "heart-api",
      "title": "Heart Disease API",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "tags": [
        "mlops"
      ],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate (req/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (path) (rate(api_requests_total[1m]))",
              "legendFormat": "{{path}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, path) (rate(api_request_latency_seconds_bucket[5m])))",
              "legendFormat": "{{path}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Client and server error share",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(api_requests_total{status=~\"4..|5..\"}[5m])) / clamp_min(sum(rate(api_requests_total[5m])), 1e-9)",
              "legendFormat": "4xx/5xx ratio"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Predictions by label",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (label) (model_predictions_total)",
              "legendFormat": "{{label}}"
            }
          ]
        }
      ]
    }
